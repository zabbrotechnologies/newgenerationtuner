<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Liquid glow filter -->
    <filter id="liquidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aerodynamic Car Silhouette Flow Line -->
  <path d="M 90 68 C 170 20, 240 18, 320 40 C 375 55, 425 80, 460 96 C 415 82, 355 64, 305 58 C 240 50, 175 42, 90 68 Z" fill="currentColor" />
  
  <!-- Sleek Top Canopy Arch Curve -->
  <path d="M 180 44 C 235 24, 275 24, 310 42 C 265 34, 220 34, 180 44 Z" fill="currentColor" />

  <!-- "NEW GENERATION TUNER'S" Main Typography -->
  <text x="250" y="102" font-family="'Space Grotesk', 'Impact', sans-serif" font-weight="900" font-size="31" letter-spacing="1.5" text-anchor="middle" fill="currentColor">
    NEW GENERATION TUNER'S
  </text>

  <!-- Subtitle: Complete Auto Diagnostics Solutions -->
  <text x="250" y="128" font-family="'Manrope', sans-serif" font-weight="700" font-size="11.5" letter-spacing="3.8" text-anchor="middle" fill="currentColor" opacity="0.9">
    Complete Auto Diagnostics Solutions
  </text>
</svg>
